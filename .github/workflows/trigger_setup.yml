name: Remote Setup Trigger

on:
  push:
    paths:
      - 'trigger.txt'

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up and Wait for Codespace
        run: |
          # 名前を直接指定して、取得ミスをゼロにします
          NAME="miniature-telegram-x5746vgvjq9vhpp4x"
          echo "Waking up Codespace: $NAME"
          
          gh codespace wakeup --codespace "$NAME"
          
          # Availableになるまで最大5分間待機
          for i in {1..30}; do
            STATUS=$(gh codespace list --json name,state -q ".[] | select(.name == \"$NAME\") | .state")
            if [ "$STATUS" == "Available" ]; then
              echo "Codespace is now Available!"
              exit 0
            fi
            echo "Current status: $STATUS... waiting 10s (Attempt $i/30)"
            sleep 10
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.MY_TOKEN }}

      - name: Start Services and Force Public
        run: |
          NAME="miniature-telegram-x5746vgvjq9vhpp4x"
          
          echo "Starting setup script via SSH..."
          gh codespace ssh -c "$NAME" -- -o StrictHostKeyChecking=no "nohup bash /workspaces/dakion/.devcontainer/setup.sh > /dev/null 2>&1 &"
          
          echo "Waiting 25 seconds for services to settle..."
          sleep 25
          
          echo "Setting port 8080 to PUBLIC..."
          gh codespace ports visibility 8080:public -c "$NAME"
        env:
          GH_TOKEN: ${{ secrets.MY_TOKEN }}
