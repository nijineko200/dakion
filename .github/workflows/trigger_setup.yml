name: Remote Setup Trigger

on:
  push:
    paths:
      - 'trigger.txt'

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Codespace to be ready
        run: |
          for i in {1..12}; do
            STATUS=$(gh codespace list --json name,state -q ".[] | select(.name | contains(\"miniature-telegram\")) | .state")
            if [ "$STATUS" == "Available" ]; then
              echo "Codespace is ready!"
              exit 0
            fi
            echo "Waiting for Codespace... current status: $STATUS"
            sleep 10
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.MY_TOKEN }}

      - name: Start Services and Then Force Public
        run: |
          NAME=$(gh codespace list --json name -q ".[] | select(.name | contains(\"miniature-telegram\")) | .name")
          
          echo "Starting setup script..."
          # 1. まずスクリプトを裏で起動させる
          gh codespace ssh -c "$NAME" -- -o StrictHostKeyChecking=no "nohup bash /workspaces/dakion/.devcontainer/setup.sh > /dev/null 2>&1 &"
          
          echo "Waiting for services to start..."
          # 2. 起動するまで少し待つ（ここが重要）
          sleep 15
          
          echo "Setting port 8080 to PUBLIC..."
          # 3. 起動したのを確認してからPublicにする
          gh codespace ports visibility 8080:public -c "$NAME"
        env:
          GH_TOKEN: ${{ secrets.MY_TOKEN }}
