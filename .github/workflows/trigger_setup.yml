name: Remote Setup Trigger

on:
  push:
    paths:
      - 'trigger.txt'

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Install Codespaces extension
        run: gh extension install github/gh-codespaces
        env:
          GH_TOKEN: ${{ secrets.MY_TOKEN }}

      - name: Wait for Codespace to be ready
        run: |
          for i in {1..12}; do
            STATUS=$(gh codespace list --json name,state -q ".[] | select(.name | contains(\"miniature-telegram\")) | .state")
            if [ "$STATUS" == "Available" ]; then
              echo "Codespace is ready!"
              exit 0
            fi
            echo "Waiting for Codespace... status is $STATUS"
            sleep 10
          done
          echo "Timeout waiting for Codespace"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.MY_TOKEN }}

      - name: Run setup script via SSH
        run: |
          NAME=$(gh codespace list --json name -q ".[] | select(.name | contains(\"miniature-telegram\")) | .name")
          gh codespace ssh -c "$NAME" "bash /workspaces/dakion/.devcontainer/setup.sh"
        env:
          GH_TOKEN: ${{ secrets.MY_TOKEN }}ー
